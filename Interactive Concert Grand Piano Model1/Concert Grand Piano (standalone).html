  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}\n.panel.collapsed .body,.panel.collapsed .tabs{display:none}\n.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;cursor:default}\n.phead h1{font-family:\"Noto Serif Thai\",serif;font-weight:600;font-size:18px;margin:0;letter-spacing:.01em}\n.phead .eyebrow{font:500 10.5px/1.35 \"IBM Plex Mono\",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}\n.collapse{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);width:26px;height:26px;border-radius:7px;font-size:14px;line-height:1;flex:none}\n#left{left:16px;top:16px;width:300px;max-height:calc(100vh - 230px)}\n#right{right:16px;top:16px;width:370px;max-height:calc(100vh - 80px)}\n.sec{padding:12px 0;border-top:1px solid var(--line)}\n.sec:first-child{border-top:0}\n.lbl{font:500 11.5px/1.3 \"IBM Plex Sans Thai\",sans-serif;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}\n.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.04);padding:3px;border-radius:9px}\n.seg button,.btn,.chip{appearance:none;font:inherit;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:7px 8px;cursor:pointer}\n.seg button.on{background:var(--ink);color:#16140f;font-weight:500}\n.list{display:flex;flex-direction:column;gap:4px}\n.opt{appearance:none;font:inherit;color:var(--ink);text-align:left;background:rgba(255,255,255,.03);border:1px solid transparent;border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer}\n.opt:hover{background:rgba(255,255,255,.07)}\n.opt.on{border-color:var(--gold);background:rgba(220,180,90,.08)}\n.opt b{font-weight:500}\n.opt small{color:var(--mute);font-size:11.5px}\n.opt .num{font:400 11px \"IBM Plex Mono\",monospace;color:var(--mute);align-self:center}\n.row{display:flex;align-items:center;gap:10px;margin:8px 0}\n.row span{flex:none;width:86px;color:var(--mute)}\n.row output{font:400 11px \"IBM Plex Mono\",monospace;width:34px;text-align:right;color:var(--mute)}\ninput[type=range]{flex:1;accent-color:var(--gold);min-width:0}\n.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n.tg{appearance:none;font:inherit;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:6px}\n.tg i{font-style:normal;font:500 10px \"IBM Plex Mono\",monospace;color:var(--mute);align-self:center}\n.tg.on{border-color:var(--gold)}.tg.on i{color:var(--gold)}\n.primary{appearance:none;font:inherit;font-weight:500;width:100%;margin-top:10px;background:var(--gold);color:#1a160f;border:0;border-radius:9px;padding:9px;cursor:pointer}\n.primary:hover{filter:brightness(1.08)}\n.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 16px 8px;background:rgba(255,255,255,.04);padding:3px;border-radius:9px}\n.tabs button{appearance:none;font:inherit;color:var(--mute);background:transparent;border:0;border-radius:7px;padding:7px 4px;cursor:pointer}\n.tabs button.on{background:rgba(255,255,255,.1);color:var(--ink)}\n.h2{font-family:\"Noto Serif Thai\",serif;font-size:20px;font-weight:600;margin:6px 0 2px;text-wrap:pretty}\n.meta{color:var(--mute);font-size:12px}\n.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}\n.specs div{background:rgba(22,20,16,.9);padding:8px}\n.specs b{display:block;font:500 15px \"IBM Plex Mono\",monospace;color:var(--ink)}\n.specs small{color:var(--mute);font-size:10.5px}\nul.tech{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}\nul.tech li{padding-left:14px;position:re mute)}\n.note{color:var(--mute);font-size:11.5px;margin-top:8px}\n#views{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;backdrop-filter:blur(14px)}\n#views button{appearance:none;font:inherit;font-size:12.5px;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}\n#views button:hover{background:rgba(255,255,255,.08)}\n#hud{position:absolute;left:16px;bottom:44px;width:300px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(14px)}\n#hud .top{display:flex;align-items:baseline;gap:10px}\n#note{font:500 34px/1 \"IBM Plex Mono\",monospace;min-width:76px}\n#freq{font:400 11.5px/1.4 \"IBM Plex Mono\",monospace;color:var(--mute)}\n#spec{width:100%;height:46px;display:block;margin:8px 0 6px}\n.keys{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--mute);font-size:11.5px}\nkbd{font:500 10.5px \"IBM Plex Mono\",monospace;color:var(--ink);background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px}\n#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#16140f;padding:8px 14px;border-radius:9px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none}\n@media (max-width:1100px){#left{width:250px}#right{width:300px}#hud{width:250px}#views{top:auto;bottom:16px;left:auto;right:330px;transform:none}#views button{padding:6px 8px}}\n@media (max-height:720px){#hud .keys{display:none}#hud{bottom:40px}#left{max-height:calc(100vh - 210px)}.phead{padding:10px 14px 8px}.phead h1{font-size:16px}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<three-d-stage name=\"concert-grand-studio\" background=\"#14120f\"><\u002Fthree-d-stage>\n\n<div id=\"ui\">\n  <aside id=\"left\" class=\"panel\">\n    <div class=\"phead\"><div><div class=\"eyebrow\">Concert Grand Studio<\u002Fdiv><h1>ห้องทดลองเปียโน<\u002Fh1><\u002Fdiv><button class=\"collapse\" data-col=\"left\">–<\u002Fbutton><\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"sec\">\n        <div class=\"lbl\">เครื่องที่เล่นด้วยคีย์บอร์ด<\u002Fdiv>\n        <div class=\"seg\" id=\"instSeg\"><button data-inst=\"grand\" class=\"on\">แกรนด์เปียโน<\u002Fbutton><button data-inst=\"ep\">เปียโนไฟฟ้า<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sec\">\n        <div class=\"lbl\"><span>ผู้ผลิต · แกรนด์<\u002Fspan><span>ยาว<\u002Fspan><\u002Fdiv>\n        <div class=\"list\" id=\"makers\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sec\">\n        <div class=\"lbl\">สไตล์ศิลปิน<\u002Fdiv>\n        <div class=\"list\" id=\"artists\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sec\">\n        <div class=\"lbl\">เสียง &amp; เอฟเฟกต์<\u002Fdiv>\n        <div class=\"row\"><span>ความแรง<\u002Fspan><input type=\"range\" id=\"vel\" min=\"0.15\" max=\"1\" step=\"0.01\" value=\"0.75\"><output id=\"velO\">75<\u002Foutput><\u002Fdiv>\n        <div class=\"row\"><span>เสียงก้องฮอลล์<\u002Fspan><input type=\"range\" id=\"rev\" min=\"0\" max=\"0.9\" step=\"0.01\" value=\"0.35\"><output id=\"revO\">35<\u002Foutput><\u002Fdiv>\n        <div class=\"toggles\">\n          <button class=\"tg\" id=\"tgSus\">Sustain <i>OFF<\u002Fi><\u002Fbutton>\n          <button class=\"tg on\" id=\"tgFx\">เอฟเฟกต์ภาพ <i>ON<\u002Fi><\u002Fbutton>\n          <button class=\"tg\" id=\"tgTrem\">Tremolo (EP) <i>OFF<\u002Fi><\u002Fbutton>\n          <button class=\"tg\" id=\"tgUna\">Una corda <i>OFF<\u002Fi><\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"primary\" id=\"demo\">▶ ฟังตัวอย่างเสียง<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div id=\"views\">\n    <button data-view=\"overview\">ภาพรวม<\u002Fbutton>\n    <button data-view=\"player\">มุมผู้เล่น<\u002Fbutton>\n    <button data-view=\"top\">มองจากบน<\u002Fbutton>\n    <button data-view=\"ep\">เปียโนไฟฟ้า<\u002Fbutton>\n  <\u002Fdiv>\n\n  <aside id=\"right\" class=\"panel\">\n    <div class=\"phead\"><div><div class=\"eyebrow\" id=\"rEyebrow\">ข้อมูล<\u002Fdiv><\u002Fdiv><button class=\"collapse\" data-col=\"right\">–<\u002Fbutton><\u002Fdiv>\n    <div class=\"tabs\" id=\"tabs\"><button data-tab=\"model\" class=\"on\">รุ่นนี้<\u002Fbutton><button data-tab=\"parts\">แยกชิ้นส่วน<\u002Fbutton><button data-tab=\"compare\">เปรียบเทียบ<\u002Fbutton><\u002Fdiv>\n    <div class=\"body\" id=\"rbody\"><\u002Fdiv>\n  <\u002Faside>\n\n  <div id=\"hud\">\n    <div class=\"top\"><div id=\"note\">—<\u002Fdiv><div id=\"freq\">คลิก/ลากบนคีย์<br>หรือพิมพ์บนคีย์บอร์ด<\u002Fdiv><\u002Fdiv>\n    <canvas id=\"spec\"><\u002Fcanvas>\n    <div class=\"keys\">\n      <span><kbd>A<\u002Fkbd>–<kbd>'<\u002Fkbd> คีย์ขาว<\u002Fspan><span><kbd>W E T Y U O P<\u002Fkbd> คีย์ดำ<\u002Fspan>\n      <span><kbd>Z<\u002Fkbd><kbd>X<\u002Fkbd> อ็อกเทฟ <b id=\"oct\" style=\"font-weight:500;color:var(--ink)\">C4<\u002Fb><\u002Fspan><span><kbd>Space<\u002Fkbd> Sustain<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"toast\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"73552ecd-33f9-4f89-99fe-9f69e441e3f0\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\nconst renderer = stage._renderer, scene = stage._scene, camera = stage._camera, controls = stage._controls;\nconst canvas = renderer.domElement;\n\n// ---------- rendering look ----------\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 1.05;\n{\n  const pm = new THREE.PMREMGenerator(renderer);\n  const env = new THREE.Scene(); env.background = new THREE.Color(0x0c0b0a);\n  const lm = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });\n  const add = (w, h, x, y, z, rx, ry, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), c ? new THREE.MeshBasicMaterial({ color: c, side: TH ve + i); if (!ks) return; kbHeld.set(e.code, ks); noteOn(ks, clamp(S.vel + 0.05));\n});\naddEventListener('keyup', e => {\n  if (e.code === 'Space') { setSustain(false); return; }\n  const ks = kbHeld.get(e.code); if (ks) { kbHeld.delete(e.code); noteOff(ks); }\n});\naddEventListener('blur', () => { kbHeld.forEach(k => noteOff(k)); kbHeld.clear(); });\n\n// ---------- demo ----------\nlet demoTimers = [];\nfunction demo() {\n  demoTimers.forEach(clearTimeout); demoTimers = []; ensureAudio();\n  const I = curI(), o = S.inst === 'grand' ? 0 : 0;\n  const prog = [[36, 48, 55, 60, 64, 67, 72, 76], [33, 45, 52, 57, 60, 64, 69, 72], [29, 41, 48, 53, 57, 60, 65, 69], [31, 43, 50, 55, 59, 62, 67, 74]];\n  let t = 0; const step = 150;\n  prog.forEach((ch, ci) => {\n    const ks = ch.map(m => I.keys.get(m + o)).filter(Boolean);\n    ks.forEach((k, j) => { demoTimers.push(setTimeout(() => noteOn(k, 0.45 + 0.35 * (j / ks.length)), t + j * step)); });\n    const end = t + ks.length * step + 500; ks.forEach(k => demoTimers.push(setTimeout(() => noteOff(k), end)));\n    t = end + 60;\n  });\n  const fin = [24, 36, 48, 55, 64, 72, 79, 84].map(m => I.keys.get(m)).filter(Boolean);\n  fin.forEach((k, j) => demoTimers.push(setTimeout(() => noteOn(k, 0.8), t + j * 18)));\n  fin.forEach(k => demoTimers.push(setTimeout(() => noteOff(k), t + 2600)));\n}\n\n// ---------- UI ----------\nfunction setInst(i, fly = true) { S.inst = i; document.querySelectorAll('#instSeg button').forEach(b => b.classList.toggle('on', b.dataset.inst === i)); S.octave = 60; $('#oct').textContent = 'C4'; S.sel = null; renderRight(); if (fly) go('player'); }\nfunction renderMakers() {\n  $('#makers').innerHTML = Object.entries(MAKERS).map(([k, m]) => `<button class=\"opt ${S.maker === k ? 'on' : ''}\" data-maker=\"${k}\"><b>${m.name}<\u002Fb><span class=\"num\">${m.L.toFixed(2)} ม.<\u002Fspan><small>${m.model} · ${m.country}<\u002Fsmall><span class=\"num\">${m.keys}k · ${m.pedals}p<\u002Fspan><\u002Fbutton>`).join('');\n  $('#artists').innerHTML = `<button class=\"opt ${!S.artist ? 'on' : ''}\" data-artist=\"\"><b>ไม่ระบุ<\u002Fb><span><\u002Fspan><small>ใช้น้ำเสียงมาตรฐานของรุ่น<\u002Fsmall><\u002Fbutton>` + Object.entries(ARTISTS).map(([k, a]) => `<button class=\"opt ${S.artist === k ? 'on' : ''}\" data-artist=\"${k}\"><b>${a.name}<\u002Fb><span class=\"num\">${MAKERS[a.maker].name.split(' ')[0]}<\u002Fspan><small>${a.sub}<\u002Fsmall><\u002Fbutton>`).join('');\n}\nfunction setMaker(k, keepArtist) {\n  S.maker = k; if (!keepArtist) S.artist = null;\n  rebuildGrand(); const t = tone(); S.reverb = S.artist ? ARTISTS[S.artist].mod.reverb : t.reverb; $('#rev').value = S.reverb; $('#revO').textContent = Math.round(S.reverb * 100); if (revSend) revSend.gain.value = S.reverb;\n  if (S.inst !== 'grand') setInst('grand', false);\n  renderMakers(); S.tab = S.tab === 'parts' ? 'parts' : 'model'; renderRight();\n  toast(`${MAKERS[k].name} ${MAKERS[k].model}${S.artist ? ' · สไตล์ ' + ARTISTS[S.artist].name : ''}`);\n}\n$('#makers').addEventListener('click', e => { const b = e.target.closest('[data-maker]'); if (b) setMaker(b.dataset.maker); });\n$('#artists').addEventListener('click', e => { const b = e.target.closest('[data-artist]'); if (!b) return; const a = b.dataset.artist || null; S.artist = a; setMaker(a ? ARTISTS[a].maker : S.maker, true); });\n$('#instSeg').addEventListener('click', e => { const b = e.target.closest('[data-inst]'); if (b) setInst(b.dataset.inst); });\n$('#views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });\n$('#vel').oninput = e => { S.vel = +e.target.value; $('#velO').textContent = Math.round(S.vel * 100); };\n$('#rev').oninput = e => { S.reverb = +e.target.value; $('#revO').textContent = Math.round(S.reverb * 100); if (revSend) revSend.gain.value = S.reverb; };\nfunction syncToggles() {\n  const set = (id, on) => { const b = $(id); b.classList.toggle('on', on); b.querySelector('i').textContent = on ? 'ON' : 'OFF'; };\n  set('#tgSus', S.sustain); set('#tgFx', S.fx); set('#tgTrem', S.trem); set('#tgUna', S.una);\n}\n$('#tgSus').onclick = () => setSustain(!S.sustain);\n$('#tgFx').onclick = () => { S.fx = !S.fx; syncToggles(); };\n$('#tgTrem').onclick = () => { ensureAudio(); S.trem = !S.trem; tremDepth.gain.value = S.trem ? 0.35 : 0; syncToggles(); };\n$('#tgUna').onclick = () => { S.una = !S.una; syncToggles(); };\n$('#demo').onclick = demo;\ndocument.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => b.blur()));\ndocument.querySelectorAll('.collapse').forEach(b => b.onclick = () => { const p = $('#' + b.dataset.col); p.classList.toggle('collapsed'); b.textContent = p.classList.contains('collapsed') ? '+' : '–'; });\n$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; renderRight(); } });\n\nfunction renderRight() {\n  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));\n  const mk = MAKERS[S.maker], el = $('#rbody');\n  $('#rEyebrow').textContent = S.inst === 'grand' ? `${mk.name} · ${mk.model}` : 'เปียโนไฟฟ้า · Tine 73';\n  if (S.tab === 'model') {\n    if (S.inst === 'grand') {\n      const a = S.artist && ARTISTS[S.artist];\n      el.innerHTML = `<div class=\"h2\">${mk.name} ${mk.model}<\u002Fdiv><div class=\"meta\">${mk.city}, ${mk.country} · ก่อตั้ง ${mk.founded}<\u002Fdiv>\n      <div class=\"specs\"><div><b>${mk.L.toFixed(2)}<\u002Fb><small>ยาว (ม.)<\u002Fsmall><\u002Fdiv><div><b>${mk.keys}<\u002Fb><small>คีย์<\u002Fsmall><\u002Fdiv><div><b>${mk.pedals}<\u002Fb><small>แป้น<\u002Fsmall><\u002Fdiv><div><b>${mk.weight.replace(' กก.', '')}<\u002Fb><small>กก.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"lbl\">ลักษณะเสียง<\u002Fdiv><div style=\"text-wrap:pretty\">${mk.character}<\u002Fdiv>\n      <div class=\"lbl\" style=\"margin-top:14px\">เทคนิคการสร้าง<\u002Fdiv><ul class=\"tech\">${mk.tech.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful>\n      ${a ? `<div class=\"quote\"><span class=\"meta\">สไตล์ ${a.name}<\u002Fspan>${a.text}<\u002Fdiv>` : ''}\n      <div class=\"note\">ลองเลือกผู้ผลิตอื่นทางซ้าย — โมเดลจะเปลี่ยนความยาว จำนวนคีย์ แป้น ทรงขา และน้ำเสียงจำลอง<\u002Fdiv>`;\n    } else {\n      el.innerHTML = `<div class=\"h2\">${EP_INFO.name}<\u002Fdiv><div class=\"meta\">${EP_INFO.model} · 73 คีย์ E1–E7<\u002Fdiv>\n      <div class=\"specs\"><div><b>1.13<\u002Fb><small>กว้าง (ม.)<\u002Fsmall><\u002Fdiv><div><b>73<\u002Fb><small>คีย์<\u002Fsmall><\u002Fdiv><div><b>1<\u002Fb><small>แป้น<\u002Fsmall><\u002Fdiv><div><b>≈60<\u002Fb><small>กก.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"lbl\">หลักการทำงาน<\u002Fdiv><ul class=\"tech\">${EP_INFO.tech.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful>\n      <div class=\"note\">เปิด Tremolo ทางซ้ายเพื่อฟังเอฟเฟกต์แอมป์แบบคลาสสิก<\u002Fdiv>`;\n    }\n  } else if (S.tab === 'parts') {\n    const I = S.inst === 'grand' ? G : EP, P = I.parts, sel = S.sel && S.sel.inst === S.inst && P[S.sel.key] ? S.sel.key : null;\n    const order = Object.keys(P);\n    let det = '';\n    if (sel) { const [th, en, d] = P[sel].info; const mn = S.inst === 'grand' && mk.parts[sel]; det = `<div class=\"detail\"><h3>${th} <span class=\"meta\">${en}<\u002Fspan><\u002Fh3><p>${d}<\u002Fp>${mn ? `<div class=\"mk\"><b>${mk.name}:<\u002Fb> ${mn}<\u002Fdiv>` : ''}<\u002Fdiv>`; }\n    el.innerHTML = `<div class=\"row\" style=\"margin-top:4px\"><span>แยกชิ้นส่วน<\u002Fspan><input type=\"range\" id=\"exp\" min=\"0\" max=\"1\" step=\"0.01\" value=\"${S.explodeT}\"><output>${Math.round(S.explodeT * 100)}<\u002Foutput><\u002Fdiv>\n      <div class=\"seg\" style=\"grid-template-columns:1fr 1fr\"><button id=\"expBtn\">${S.explodeT > 0.5 ? 'ประกอบกลับ' : 'แยกชิ้นส่วนทั้งหมด'}<\u002Fbutton><button id=\"expView\">มุมมองแยกชิ้น<\u002Fbutton><\u002Fdiv>\n      ${det}\n      <div class=\"parts\">${order.map((k, i) => `<button class=\"part ${sel === k ? 'on' : ''}\" data-part=\"${k}\"><span class=\"n\">${String(i + 1).padStart(2, '0')}<\u002Fspan><span>${P[k].info[0]} <span class=\"meta\">${P[k].info[1]}<\u002Fspan><\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>\n      <div class=\"note\">คลิกชิ้นส่วนในโมเดลหรือในรายการเพื่ออ่านคำอธิบาย · ยังเล่นคีย์ได้ขณะแยกชิ้นส่วน — ดูค้อนและสายทำงาน<\u002Fdiv>`;\n    const ex = $('#exp'); ex.oninput = () => { S.explodeT = +ex.value; ex.nextElementSibling.textContent = Math.round(S.explodeT * 100); };\n    $('#expBtn').onclick = () => { S.explodeT = S.explodeT > 0.5 ? 0 : 1; renderRight(); if (S.explodeT) go('exploded'); };\n    $('#expView').onclick = () => go('exploded');\n    el.querySelectorAll('[data-part]').forEach(b => b.onclick = () => selectPart(I, b.dataset.part, true));\n  } else {\n    const ks = Object.entries(MAKERS);\n    const bar = (lab, val, pct, cur) => `<div class=\"bar ${cur ? 'cur' : ''}\"><span>${lab}<\u002Fspan><div class=\"t\"><i style=\"width:${Math.round(pct * 100)}%\"><\u002Fi><\u002Fdiv><output>${val}<\u002Foutput><\u002Fdiv>`;\n    const blk = (title, fn) => `<div class=\"sec\"><div class=\"lbl\">${title}<\u002Fdiv><div class=\"bars\">${ks.map(([k, m]) => fn(k, m)).join('')}<\u002Fdiv><\u002Fdiv>`;\n    el.innerHTML = `<div class=\"h2\">เปรียบเทียบผู้ผลิต<\u002Fdiv><div class=\"meta\">รุ่นเรือธงคอนเสิร์ตแกรนด์ · คลิกชื่อทางซ้ายเพื่อโหลดโมเดล<\u002Fdiv>\n    ${blk('ความยาวตัวเครื่อง', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), m.L.toFixed(2) + ' ม.', (m.L - 2.5) / 0.6, k === S.maker))}\n    ${blk('ความสว่างของเสียง (ค่าจำลอง)', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), Math.round(m.tone.bright * 100), m.tone.bright, k === S.maker))}\n    ${blk('ความยาวเสียง / ซัสเทน (ค่าจำลอง)', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), m.tone.decay.toFixed(2) + '×', m.tone.decay / 1.35, k === S.maker))}\n    <div class=\"sec\"><div class=\"lbl\">จุดเด่นเชิงช่าง<\u002Fdiv><ul class=\"tech\">${ks.map(([k, m]) => `<li><b style=\"font-weight:500;color:${k === S.maker ? 'var(--gold)' : 'var(--ink)'}\">${m.name}<\u002Fb> — ${m.tech[0]}<\u002Fli>`).join('')}<\u002Ful><\u002Fdiv>\n    <div class=\"sec\"><div class=\"lbl\">อะคูสติก vs ไฟฟ้า vs ดิจิทัล<\u002Fdiv>\n    <div class=\"cmp\"><div><\u002Fdiv><div class=\"hd\">แกรนด์<\u002Fdiv><div class=\"hd\">ไฟฟ้า (ไทน์)<\u002Fdiv><div class=\"hd\">ดิจิทัล<\u002Fdiv>\n    <div class=\"rh\">กำเนิดเสียง<\u002Fdiv><div>ค้อนสักหลาดตีสายเหล็ก<\u002Fdiv><div>ค้อนยางตีแท่งไทน์<\u002Fdiv><div>เซนเซอร์อ่านความเร็วคีย์ → เสียงแซมเปิล/แบบจำลอง<\u002Fdiv>\n    <div class=\"rh\">ขยายเสียง<\u002Fdiv><div>ซาวด์บอร์ด + ตัวเครื่อง<\u002Fdiv><div>ปิกอัพ → แอมป์<\u002Fdiv><div>ลำโพงในตัว / หูฟัง<\u002Fdiv>\n    <div class=\"rh\">การจูน<\u002Fdiv><div>ทุก 6–12 เดือน<\u002Fdiv><div>นานๆ ครั้ง เลื่อนสปริงถ่วง<\u002Fdiv><div>ไม่ต้องจูน<\u002Fdiv>\n    <div class=\"rh\">น้ำหนัก<\u002Fdiv><div>480–690 กก.<\u002Fdiv><div>≈60 กก.<\u002Fdiv><div>12–30 กก.<\u002Fdiv>\n    <div class=\"rh\">สีเสียง<\u002Fdiv><div>ฮาร์มอนิกซับซ้อน สายสั่นพ้องกัน<\u002Fdiv><div>หวาน กลม คล้ายระฆัง กดแรงแล้ว “bark”<\u002Fdiv><div>ขึ้นกับคุณภาพแซมเปิล<\u002Fdiv><\u002Fdiv>\n    <div class=\"note\">ค่าความสว่าง/ซัสเทนเป็นพารามิเตอร์ของเสียงสังเคราะห์ในเดโมนี้ ใช้เทียบลักษณะโดยประมาณ ไม่ใช่ค่าวัดจริง<\u002Fdiv><\u002Fdiv>`;\n  }\n}\nrenderMakers(); renderRight(); syncToggles();\nwindow.__piano = { S, get G() { return G; }, get EP() { return EP; }, noteOn, tick, setMaker, go };\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
