<style>
:root{--ink:#ece6da;--mute:#a39b8c;--line:rgba(236,228,214,.12);--panel:rgba(22,20,16,.86);--gold:oklch(0.80 0.11 82);--gold-d:oklch(0.62 0.10 78)}

#note{font:500 34px/1 "IBM Plex Mono",monospace;min-width:76px}

@media (max-width:1100px){#left{width:250px}#right{width:300px}#hud{width:250px}#views{top:auto;bottom:16px;left:auto;right:330px;transform:none}#views button{padding:6px 8px}}

<body>
<three-d-stage name="concert-grand-studio" background="#14120f"></three-d-stage>

<div id="ui">
  <aside id="left" class="panel">
    <div class="phead"><div><div class="eyebrow">Concert Grand Studio</div><h1>ห้องทดลองเปียโน</h1></div><button class="collapse" data-col="left">–</button></div>
    <div class="body">
      <div class="sec">
        <div class="lbl">เครื่องที่เล่นด้วยคีย์บอร์ด</div>
        <div class="seg" id="instSeg"><button data-inst="grand" class="on">แกรนด์เปียโน</button><button data-inst="ep">เปียโนไฟฟ้า</button></div>
      </div>
      <div class="sec">
        <div class="lbl"><span>ผู้ผลิต · แกรนด์</span><span>ยาว</span></div>
        <div class="list" id="makers"></div>
      </div>
      <div class="sec">
        <div class="lbl">สไตล์ศิลปิน</div>
        <div class="list" id="artists"></div>
      </div>
      <div class="sec">
        <div class="lbl">เสียง & เอฟเฟกต์</div>
        <div class="row"><span>ความแรง</span><input type="range" id="vel" min="0.15" max="1" step="0.01" value="0.75"><output id="velO">75</output></div>
        <div class="row"><span>เสียงก้องฮอลล์</span><input type="range" id="rev" min="0" max="0.9" step="0.01" value="0.35"><output id="revO">35</output></div>
        <div class="toggles">
          <button class="tg" id="tgSus">Sustain <i>OFF</i></button>
          <button class="tg on" id="tgFx">เอฟเฟกต์ภาพ <i>ON</i></button>
          <button class="tg" id="tgTrem">Tremolo (EP) <i>OFF</i></button>
          <button class="tg" id="tgUna">Una corda <i>OFF</i></button>
        </div>
        <button class="primary" id="demo">▶ ฟังตัวอย่างเสียง</button>
      </div>
    </div>
  </aside>

  <div id="views">
    <button data-view="overview">ภาพรวม</button>
    <button data-view="player">มุมผู้เล่น</button>
    <button data-view="top">มองจากบน</button>
    <button data-view="ep">เปียโนไฟฟ้า</button>
  </div>

  <aside id="right" class="panel">
    <div class="phead"><div><div class="eyebrow" id="rEyebrow">ข้อมูล</div></div><button class="collapse" data-col="right">–</button></div>
    <div class="tabs" id="tabs"><button data-tab="model" class="on">รุ่นนี้</button><button data-tab="parts">แยกชิ้นส่วน</button><button data-tab="compare">เปรียบเทียบ</button></div>
    <div class="body" id="rbody"></div>
  </aside>

  <div id="hud">
    <div class="top"><div id="note">—</div><div id="freq">คลิก/ลากบนคีย์<br>หรือพิมพ์บนคีย์บอร์ด</div></div>
    <canvas id="spec"></canvas>
    <div class="keys">
      <span><kbd>A</kbd>–<kbd>'</kbd> คีย์ขาว</span><span><kbd>W E T Y U O P</kbd> คีย์ดำ</span>
      <span><kbd>Z</kbd><kbd>X</kbd> อ็อกเทฟ <b id="oct" style="font-weight:500;color:var(--ink)">C4</b></span><span><kbd>Space</kbd> Sustain</span>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene, camera = stage._camera, controls = stage._controls;
const canvas = renderer.domElement;

// ---------- rendering look ----------
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
{
  const pm = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene(); env.background = new THREE.Color(0x0c0b0a);
  const lm = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const add = (w, h, x, y, z, rx, ry, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), c ? new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }) : lm); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); env.add(m); };
  add(8, 3, 0, 6, 0, Math.PI / 2, 0);
  add(1.2, 6, -6, 2.5, 2, 0, Math.PI / 2, 0xfff1dc);
  add(1.2, 6, 6, 2.5, -2, 0, -Math.PI / 2, 0xbcd0ff);
  add(10, 0.6, 0, 1.5, -7, 0, 0, 0x8a7a66);
  scene.environment = pm.fromScene(env, 0.035).texture;
  scene.environmentIntensity = 1.25;
}
const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96), new THREE.MeshStandardMaterial({ color: 0x2a231b, roughness: 0.62 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.003; floor.receiveShadow = true; scene.add(floor);

// ---------- helpers ----------
const MAT = (name, color, roughness, metalness = 0) => new THREE.MeshStandardMaterial({ name, color, roughness, metalness });
const mats = {
  ebony: MAT('ebony_polish', 0x121214, 0.12),
  caseWood: MAT('case_wood', 0x2a1c12, 0.7),
  ivory: MAT('key_ivory', 0xf2eee4, 0.32),
  keyBlack: MAT('key_ebony', 0x121212, 0.28),
  keyExt: MAT('key_extended', 0x2d2b29, 0.3),
  plate: MAT('plate_gold', 0xc29a48, 0.34, 0.55),
  spruce: MAT('spruce', 0xd8b885, 0.62),
  maple: MAT('maple', 0xa5733f, 0.55),
  felt: MAT('hammer_felt', 0xece5d6, 0.95),
  steel: MAT('steel_string', 0xdcdcdc, 0.22, 0.75),
  copper: MAT('copper_string', 0xc07a3c, 0.3, 0.65),
  brass: MAT('brass', 0xd8b25c, 0.28, 0.65),
  leather: MAT('leather', 0x1d1714, 0.65),
  tolex: MAT('tolex', 0x1c1c1c, 0.88),
  plastic: MAT('harp_cover', 0x151515, 0.42),
  chrome: MAT('chrome', 0xd2d6da, 0.18, 0.8),
  alu: MAT('aluminium', 0xb6babe, 0.35, 0.6),
  tine: MAT('tine_steel', 0xc9ccd0, 0.3, 0.7),
  coil: MAT('pickup_coil', 0x8e2c1f, 0.5),
  rubber: MAT('neoprene', 0x2b2b2b, 0.9),
};
function mesh(geo, mat, name, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
const boxG = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function xf(g, x, y, z, rx = 0, ry = 0, rz = 0) { g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(1, 1, 1))); return g; }
const boxAt = (w, h, d, x, y, z, rx, ry, rz) => xf(boxG(w, h, d), x, y, z, rx, ry, rz);
function merge(list) {
  const arr = list.map(g => g.index ? g.toNonIndexed() : g);
  let n = 0; arr.forEach(g => n += g.attributes.position.count);
  const p = new Float32Array(n * 3), q = new Float32Array(n * 3); let o = 0;
  arr.forEach(g => { p.set(g.attributes.position.array, o * 3); q.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(p, 3)); out.setAttribute('normal', new THREE.BufferAttribute(q, 3));
  return out;
}
function cylBetween(a, b, r, seg = 12) {
  const len = a.distanceTo(b); const g = new THREE.CylinderGeometry(r, r, len, seg);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  g.applyMatrix4(new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), q, new THREE.Vector3(1, 1, 1))); return g;
}
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const BLACK = new Set([1, 3, 6, 8, 10]);
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const freqOf = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const WK = 0.0235;
function layout(lo, hi) { const list = []; let wi = 0; for (let m = lo; m <= hi; m++) { const b = BLACK.has(m % 12); list.push({ m, black: b, wi }); if (!b) wi++; } return { list, whites: wi, W: wi * WK }; }
const keyX = (k, W) => k.black ? -W / 2 + k.wi * WK : -W / 2 + (k.wi + 0.5) * WK;
const whiteGeo = merge([boxAt(WK - 0.0014, 0.022, 0.15, 0, -0.011, 0.075), boxAt(0.009, 0.018, 0.25, 0, -0.013, -0.125)]);
const blackGeo = merge([boxAt(0.0126, 0.0135, 0.095, 0, 0.0073, 0.0475), boxAt(0.009, 0.018, 0.25, 0, -0.013, -0.125)]);
const epWhiteGeo = merge([boxAt(WK - 0.0014, 0.022, 0.15, 0, -0.011, 0.075), boxAt(0.009, 0.018, 0.12, 0, -0.013, -0.06)]);
const epBlackGeo = merge([boxAt(0.0126, 0.0135, 0.095, 0, 0.0073, 0.0475), boxAt(0.009, 0.018, 0.12, 0, -0.013, -0.06)]);

// grand outline (x, d) — d = depth behind keyboard front
function outline(L, hw) {
  const p = new THREE.Path(); p.moveTo(-hw, 0); p.lineTo(-hw, L * 0.78);
  p.bezierCurveTo(-hw, L * 0.965, -hw * 0.72, L, -hw * 0.3, L);
  p.bezierCurveTo(hw * 0.04, L, hw * 0.3, L * 0.93, hw * 0.38, L * 0.79);
  p.bezierCurveTo(hw * 0.47, L * 0.6, hw * 0.62, L * 0.4, hw * 0.87, L * 0.32);
  p.bezierCurveTo(hw * 0.99, L * 0.285, hw, L * 0.24, hw, L * 0.18);

    if (sel) { const [th, en, d] = P[sel].info; const mn = S.inst === 'grand' && mk.parts[sel]; det = `<div class="detail"><h3>${th} <span class="meta">${en}</span></h3><p>${d}</p>${mn ? `<div class="mk"><b>${mk.name}:</b> ${mn}</div>` : ''}</div>`; }
    el.innerHTML = `<div class="row" style="margin-top:4px"><span>แยกชิ้นส่วน</span><input type="range" id="exp" min="0" max="1" step="0.01" value="${S.explodeT}"><output>${Math.round(S.explodeT * 100)}</output></div>
      <div class="seg" style="grid-template-columns:1fr 1fr"><button id="expBtn">${S.explodeT > 0.5 ? 'ประกอบกลับ' : 'แยกชิ้นส่วนทั้งหมด'}</button><button id="expView">มุมมองแยกชิ้น</button></div>
      ${det}
      <div class="parts">${order.map((k, i) => `<button class="part ${sel === k ? 'on' : ''}" data-part="${k}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${P[k].info[0]} <span class="meta">${P[k].info[1]}</span></span></button>`).join('')}</div>
      <div class="note">คลิกชิ้นส่วนในโมเดลหรือในรายการเพื่ออ่านคำอธิบาย · ยังเล่นคีย์ได้ขณะแยกชิ้นส่วน — ดูค้อนและสายทำงาน</div>`;
    const ex = $('#exp'); ex.oninput = () => { S.explodeT = +ex.value; ex.nextElementSibling.textContent = Math.round(S.explodeT * 100); };
    $('#expBtn').onclick = () => { S.explodeT = S.explodeT > 0.5 ? 0 : 1; renderRight(); if (S.explodeT) go('exploded'); };
    $('#expView').onclick = () => go('exploded');
    el.querySelectorAll('[data-part]').forEach(b => b.onclick = () => selectPart(I, b.dataset.part, true));
  } else {
    const ks = Object.entries(MAKERS);
    const bar = (lab, val, pct, cur) => `<div class="bar ${cur ? 'cur' : ''}"><span>${lab}</span><div class="t"><i style="width:${Math.round(pct * 100)}%"></i></div><output>${val}</output></div>`;
    const blk = (title, fn) => `<div class="sec"><div class="lbl">${title}</div><div class="bars">${ks.map(([k, m]) => fn(k, m)).join('')}</div></div>`;
    el.innerHTML = `<div class="h2">เปรียบเทียบผู้ผลิต</div><div class="meta">รุ่นเรือธงคอนเสิร์ตแกรนด์ · คลิกชื่อทางซ้ายเพื่อโหลดโมเดล</div>
    ${blk('ความยาวตัวเครื่อง', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), m.L.toFixed(2) + ' ม.', (m.L - 2.5) / 0.6, k === S.maker))}
    ${blk('ความสว่างของเสียง (ค่าจำลอง)', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), Math.round(m.tone.bright * 100), m.tone.bright, k === S.maker))}
    ${blk('ความยาวเสียง / ซัสเทน (ค่าจำลอง)', (k, m) => bar(m.name.replace('Steinway & Sons', 'Steinway').replace('C. ', ''), m.tone.decay.toFixed(2) + '×', m.tone.decay / 1.35, k === S.maker))}
    <div class="sec"><div class="lbl">จุดเด่นเชิงช่าง</div><ul class="tech">${ks.map(([k, m]) => `<li><b style="font-weight:500;color:${k === S.maker ? 'var(--gold)' : 'var(--ink)'}">${m.name}</b> — ${m.tech[0]}</li>`).join('')}</ul></div>
    <div class="sec"><div class="lbl">อะคูสติก vs ไฟฟ้า vs ดิจิทัล</div>
    <div class="cmp"><div></div><div class="hd">แกรนด์</div><div class="hd">ไฟฟ้า (ไทน์)</div><div class="hd">ดิจิทัล</div>
    <div class="rh">กำเนิดเสียง</div><div>ค้อนสักหลาดตีสายเหล็ก</div><div>ค้อนยางตีแท่งไทน์</div><div>เซนเซอร์อ่านความเร็วคีย์ → เสียงแซมเปิล/แบบจำลอง</div>
    <div class="rh">ขยายเสียง</div><div>ซาวด์บอร์ด + ตัวเครื่อง</div><div>ปิกอัพ → แอมป์</div><div>ลำโพงในตัว / หูฟัง</div>
    <div class="rh">การจูน</div><div>ทุก 6–12 เดือน</div><div>นานๆ ครั้ง เลื่อนสปริงถ่วง</div><div>ไม่ต้องจูน</div>
    <div class="rh">น้ำหนัก</div><div>480–690 กก.</div><div>≈60 กก.</div><div>12–30 กก.</div>
    <div class="rh">สีเสียง</div><div>ฮาร์มอนิกซับซ้อน สายสั่นพ้องกัน</div><div>หวาน กลม คล้ายระฆัง กดแรงแล้ว “bark”</div><div>ขึ้นกับคุณภาพแซมเปิล</div></div>
    <div class="note">ค่าความสว่าง/ซัสเทนเป็นพารามิเตอร์ของเสียงสังเคราะห์ในเดโมนี้ ใช้เทียบลักษณะโดยประมาณ ไม่ใช่ค่าวัดจริง</div></div>`;
  }
}
renderMakers(); renderRight(); syncToggles();
window.__piano = { S, get G() { return G; }, get EP() { return EP; }, noteOn, tick, setMaker, go };
</script>
</body>
</html>
