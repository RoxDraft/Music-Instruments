<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Created by Claude (Anthropic) -->
<title>Music Instruments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#14100c;color:#efe6d6;font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
a{color:#c9a45c;text-decoration:none}
a:hover{color:#e6c88a}
main{max-width:1040px;margin:0 auto;padding:72px 24px}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(40px,7vw,72px);margin:0 0 8px;letter-spacing:-.01em}
.sub{color:#b8ab95;margin:0 0 48px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid #3a2f22;border-radius:6px;background:#1c1610;transition:border-color .2s,transform .2s}
.card:hover{border-color:#c9a45c;transform:translateY(-2px)}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c9a45c}
.card h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;margin:0;color:#efe6d6}
.card p{margin:0;color:#b8ab95;font-size:15px;line-height:1.6;text-wrap:pretty}
.soon{opacity:.45;pointer-events:none}
footer{margin-top:64px;color:#7d715f;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Music Instruments</h1>
<p class="sub">เครื่องดนตรีอะคูสติกและเครื่องดนตรีไฟฟ้า แบบ 3 มิติที่เล่นได้</p>
<div class="grid" id="grid"></div>
<footer>สร้างโดย Claude (Anthropic)</footer>
</main>
<script>
// เพิ่มเครื่องดนตรีใหม่: ใส่ชื่อโฟลเดอร์ใน folder (ถ้ายังไม่พร้อม ให้ใส่ soon: true)
const instruments = [
  { folder: "Interactive Concert Grand Piano Model1", tag: "Keyboard", name: "Concert Grand Piano", desc: "แกรนด์เปียโนเล่นได้ เปิดดูกลไกภายใน เทียบผู้ผลิตแต่ละเจ้า และมีเปียโนไฟฟ้าวางเทียบข้างๆ" },
];
document.getElementById("grid").innerHTML = instruments.map(i =>
  `<a class="card${i.soon ? " soon" : ""}" href="${encodeURI(i.folder)}/">
     <span class="tag">${i.tag}${i.soon ? " · เร็วๆ นี้" : ""}</span>
     <h2>${i.name}</h2><p>${i.desc}</p></a>`).join("");
</script>
</body>
</html>
